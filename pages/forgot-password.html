<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password | Caterly</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/navbar.js"></script>
    <script src="../js/app.js" defer></script>
</head>
<body class="auth-page-body">
    <main>
        <section class="auth-shell auth-reset" aria-labelledby="forgot-heading">
            <div class="auth-visual">
                <p class="auth-visual-kicker">Right this way</p>
                <div>
                    <p class="auth-visual-mark">Caterly</p>
                    <h2>Your plans are still here.</h2>
                    <p>Return to the details that make your next event special.</p>
                </div>
                <p class="auth-visual-note">Nothing memorable happens by accident.</p>
            </div>

            <div class="auth-content">
                <div class="auth-content-inner">
                    <p class="login-kicker">Account recovery</p>
                    <h1 id="forgot-heading">Reset your password</h1>
                    <p class="form-note">Enter your email and we’ll send instructions to help you get back into your account.</p>

                    <form class="auth-form reset-form" novalidate>
                    <div class="form-field">
                        <label for="reset-email">Email address</label>
                        <input type="email" id="reset-email" name="email" autocomplete="email" placeholder="you@example.com" required>
                        <span class="field-error" id="reset-email-error"></span>
                    </div>
                    <button class="login-submit" type="submit">Send reset link</button>
                    <p class="login-status" role="status" aria-live="polite"></p>
                </form>

                    <p class="signup-prompt"><a href="login.html">Return to sign in</a></p>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
